name: Continuous Integration

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore HostlistDownloader.slnx
      working-directory: ./src/HostlistDownloaderCLI

    - name: Build
      run: dotnet build HostlistDownloader.slnx --configuration Release --no-restore
      working-directory: ./src/HostlistDownloaderCLI

    - name: Test
      run: dotnet test HostlistDownloader.slnx --configuration Release --no-build --verbosity normal
      working-directory: ./src/HostlistDownloaderCLI

    # Checks that the trimmed single-file executable still publishes on each OS (not uploaded).
    - name: Publish (trimmed, single file)
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Windows) rid=win-x64 ;;
          Linux)   rid=linux-x64 ;;
          macOS)   rid=osx-arm64 ;;
        esac
        dotnet publish HostlistDownloaderCLI.csproj -c Release -r $rid --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ./ci-publish
      working-directory: ./src/HostlistDownloaderCLI
